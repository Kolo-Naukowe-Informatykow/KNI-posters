# Wzorcowy docker-compose.yml dla generatora postow.
# Skopiuj do docker-compose.yml (obok klonu repo), uzupelnij .env i uruchom:
#   docker compose up -d --build
#
# Jesli trzymasz compose w osobnym katalogu, a repo lezy w podkatalogu (np. ./app),
# ustaw build.context na ten podkatalog. Port publikuj tylko tam, gdzie ma byc dostepny
# (np. "127.0.0.1:8083:8083" za reverse proxy).

services:
  kni-posters:
    build:
      context: .
      dockerfile: Dockerfile
    image: kni-posters:local
    container_name: kni-posters
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=Europe/Warsaw
      - PORT=8083
      - OUT_DIR=/app/out
      # ile renderow naraz - zostaw zapas CPU/RAM dla reszty hosta
      - REMOTION_CONCURRENCY=2
    ports:
      - "8083:8083"
    volumes:
      # wyniki renderow, cache bundla i historia zadan (jobs.json)
      - ./out:/app/out
    read_only: true
    tmpfs:
      - /tmp:size=1g
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.PORT||8083)+'/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
